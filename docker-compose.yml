services:
  web:
    build: .
    image: jilv
    restart: unless-stopped
    ports:
      - "${JILV_PORT:-8098}:8098"
    environment:
      NODE_ENV: production
      PORT: "8098"
      HOST: 0.0.0.0
      NITRO_HOST: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8098/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
